<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="28%" cy="34%" r="90%">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="45%" stop-color="#140f0b"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </radialGradient>
    <radialGradient id="colGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a1f2b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7a1f2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hrule-underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a24b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGlow)"/>
  <circle cx="850" cy="560" r="360" fill="url(#emberGlow)"/>

  <!-- inscribed frame -->
  <rect x="46" y="46" width="1108" height="538" rx="2" fill="none" stroke="rgba(243,236,223,0.16)" stroke-width="1.2"/>
  <polygon points="46,39 53,46 46,53 39,46" fill="#c9a24b"/>
  <polygon points="1154,39 1161,46 1154,53 1147,46" fill="#c9a24b"/>
  <polygon points="46,577 53,584 46,591 39,584" fill="#c9a24b"/>
  <polygon points="1154,577 1161,584 1154,591 1147,584" fill="#c9a24b"/>

  <!-- column mark, spotlit -->
  <circle cx="230" cy="326" r="175" fill="url(#colGlow)"/>
  <ellipse cx="230" cy="516" rx="86" ry="10" fill="#000000" opacity="0.4"/>
  <g transform="translate(110,203) scale(7.5)">
    <rect x="9" y="8" width="14" height="2.2" fill="#c9a24b"/>
    <rect x="11" y="10.2" width="10" height="1.3" fill="#c9a24b" opacity="0.85"/>
    <rect x="13" y="11.5" width="6" height="12.5" fill="#c9a24b"/>
    <line x1="15" y1="12.3" x2="15" y2="23.2" stroke="#0b0908" stroke-width="0.26" opacity="0.5"/>
    <line x1="17" y1="12.3" x2="17" y2="23.2" stroke="#0b0908" stroke-width="0.26" opacity="0.5"/>
    <rect x="10" y="24" width="12" height="1.3" fill="#c9a24b" opacity="0.85"/>
    <rect x="9" y="25.3" width="14" height="2.2" fill="#c9a24b"/>
  </g>

  <!-- divider -->
  <line x1="420" y1="140" x2="420" y2="505" stroke="url(#vrule)" stroke-width="1.2"/>

  <!-- text block -->
  <text x="460" y="222" font-family="JetBrains Mono" font-size="21" letter-spacing="7" fill="#9c8f7a">MARBLE &amp; EMBER</text>

  <text x="457" y="368" font-family="Cinzel" font-weight="700" font-size="118" letter-spacing="5" fill="#f3ecdf">THREAD</text>

  <line x1="460" y1="404" x2="640" y2="404" stroke="url(#hrule-underline)" stroke-width="2.5"/>

  <text font-family="Cormorant Garamond" font-style="italic" font-weight="500" font-size="32" fill="#f3ecdf" opacity="0.78">
    <tspan x="460" y="462">Remember them —</tspan>
    <tspan x="460" y="502">the way they deserve.</tspan>
  </text>

  <!-- colophon -->
  <line x1="1014" y1="530" x2="1104" y2="530" stroke="url(#hrule)" stroke-width="1.2"/>
  <text x="1104" y="555" font-family="JetBrains Mono" font-size="16" letter-spacing="3.5" fill="#9c8f7a" text-anchor="end">CREATED BY ARINDAL</text>
</svg>